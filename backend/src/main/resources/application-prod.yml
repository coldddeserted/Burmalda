# Run with the prod profile: --spring.profiles.active=prod
spring:
  datasource:
    url: ${DB_URL}            # e.g. jdbc:postgresql://host:5432/burmalda
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}     # no default: required in production
  seed:
    enabled: ${SEED_DEMO:false}
