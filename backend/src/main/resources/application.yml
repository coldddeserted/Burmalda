server:
  port: 8080

spring:
  application:
    name: burmalda-backend

  # Локальная БД в файле ./data/burmalda.mv.db — ничего ставить не надо.
  # Хочешь начисто пересоздать демо-данные — останови сервер и удали папку ./data
  datasource:
    url: jdbc:h2:file:./data/burmalda;AUTO_SERVER=TRUE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console   # http://localhost:8080/h2-console

  jpa:
    hibernate:
      ddl-auto: update    # таблицы создаются из @Entity автоматически
    show-sql: false       # поставь true, если хочешь видеть SQL в консоли
    open-in-view: false

  jackson:
    default-property-inclusion: non_null   # null-поля не отправляем фронту

app:
  jwt:
    # В проде ОБЯЗАТЕЛЬНО задать свой через переменную окружения JWT_SECRET (минимум 32 символа)
    secret: ${JWT_SECRET:dev-only-secret-change-me-burmalda-2026-local}
    ttl-hours: 12

  seed:
    enabled: ${SEED_DEMO:true}   # демо-данные при первом запуске

  # PayPal Payouts (Mass Pay). Без ключей — режим симуляции.
  # Ключи: developer.paypal.com -> Apps & Credentials -> Sandbox
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}

  # AI Burmalda = Google Gemini agent with tools. Free key: aistudio.google.com -> Get API key.
  # Without a key the chat answers with rules on the same real data.
  ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-3.8-flash}
    # comma-separated models to try if the main one is overloaded (503) or rate-limited (429)
    fallback-models: ${AI_FALLBACK_MODELS:}
    base-url: https://generativelanguage.googleapis.com

  # Folder with the frontend (login.html, js/, css/). Empty = auto: ".." (repo root when run from backend/) or ".".
  frontend-dir: ${FRONTEND_DIR:}

  cors:
    # Нужно только если фронт открыт НЕ через localhost:8080 (например, из IDEA на 63342)
    allowed-origins: http://localhost:63342,http://localhost:5500,http://127.0.0.1:5500
