server:
  port: ${PORT:8080}   # hosting platforms (Render) pass the port in PORT

spring:
  application:
    name: burmalda-backend

  # Local database in the file ./data/burmalda.mv.db — nothing to install.
  # To recreate the demo data from scratch, stop the server and delete the ./data folder
  datasource:
    url: jdbc:h2:file:./data/burmalda;AUTO_SERVER=TRUE
    username: sa
    password:

  h2:
    console:
      enabled: ${H2_CONSOLE:true}   # switched off on the public deployment (render.yaml)
      path: /h2-console   # http://localhost:8080/h2-console

  jpa:
    hibernate:
      ddl-auto: update    # tables are created from @Entity classes automatically
    show-sql: false       # set to true to see SQL in the console
    open-in-view: false

  jackson:
    default-property-inclusion: non_null   # null fields are not sent to the frontend

app:
  jwt:
    # In production you MUST set your own via the JWT_SECRET environment variable (at least 32 characters)
    secret: ${JWT_SECRET:dev-only-secret-change-me-burmalda-2026-local}
    ttl-hours: 12

  seed:
    enabled: ${SEED_DEMO:true}   # demo data on the first start

  # PayPal Payouts (Mass Pay). Without keys it runs in simulation mode.
  # Keys: developer.paypal.com -> Apps & Credentials -> Sandbox
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}

  # AI Burmalda = Google Gemini agent with tools. Free key: aistudio.google.com -> Get API key.
  # Without a key the chat answers with rules on the same real data.
  ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-3.8-flash}
    # comma-separated models to try if the main one is overloaded (503) or rate-limited (429)
    fallback-models: ${AI_FALLBACK_MODELS:}
    base-url: https://generativelanguage.googleapis.com

  # Folder with the frontend (login.html, js/, css/). Empty = auto: ".." (repo root when run from backend/) or ".".
  frontend-dir: ${FRONTEND_DIR:}

  cors:
    # Needed only when the frontend is NOT opened via localhost:8080 (e.g. from IDEA on port 63342)
    allowed-origins: http://localhost:63342,http://localhost:5500,http://127.0.0.1:5500
